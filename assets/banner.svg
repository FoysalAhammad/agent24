<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-label="Agent 24 - autonomous AI assistant for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/><stop offset="55%" stop-color="#07051a"/>
      <stop offset="100%" stop-color="#03140f"/>
    </linearGradient>
    <radialGradient id="gV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a2be2"/><stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84"/><stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8a2be2"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3ddc84" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="1010" cy="70" r="300" fill="url(#gV)"/>
  <circle cx="120" cy="380" r="280" fill="url(#gG)"/>
  <circle cx="620" cy="400" r="240" fill="url(#gC)"/>

  <rect width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;420" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#3ddc84" stroke-opacity="0.85" stroke-width="2.5" fill="none">
    <path d="M26 78 V26 H78"/><path d="M1174 78 V26 H1112"/>
    <path d="M26 342 V394 H78"/><path d="M1174 342 V394 H1112"/>
  </g>

  <!-- terminal -->
  <g>
    <rect x="56" y="70" width="700" height="240" rx="10" fill="#050810" fill-opacity="0.92"
          stroke="#3ddc84" stroke-opacity="0.55"/>
    <rect x="56" y="70" width="700" height="34" rx="10" fill="#0b1220"/>
    <rect x="56" y="94" width="700" height="10" fill="#0b1220"/>
    <circle cx="80" cy="87" r="6" fill="#ff5f57"/>
    <circle cx="100" cy="87" r="6" fill="#ffb300"/>
    <circle cx="120" cy="87" r="6" fill="#3ddc84"/>
    <text x="406" y="92" text-anchor="middle" font-family="Fira Code, Consolas, monospace"
          font-size="14" fill="#7f93ad" letter-spacing="1">agent24@android:~</text>

    <text x="78" y="146" font-family="Fira Code, Consolas, monospace" font-size="21" fill="#8a2be2">$</text>
    <text x="102" y="146" font-family="Fira Code, Consolas, monospace" font-size="21" fill="#e6edf3">agent24 --status</text>
    <text x="78" y="192" font-family="Fira Code, Consolas, monospace" font-size="18" fill="#3ddc84">&#62; 31 tools &#183; 7 agents &#183; 13+ providers</text>
    <text x="78" y="230" font-family="Fira Code, Consolas, monospace" font-size="18" fill="#22d3ee">&#62; permission-first &#183; everything local</text>
    <text x="78" y="278" font-family="Fira Code, Consolas, monospace" font-size="20" fill="#ffb300">$</text>
    <rect x="100" y="262" width="13" height="22" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- glitch title -->
  <g font-family="Fira Code, Consolas, monospace" font-size="40" font-weight="700" fill="#8a2be2"
     opacity="0.55" filter="url(#soft)">
    <text x="790" y="156">AGENT 24</text>
    <animate attributeName="x" values="790;785;793;790" dur="3.2s" repeatCount="indefinite"/>
  </g>
  <text x="788" y="154" font-family="Fira Code, Consolas, monospace" font-size="40" font-weight="700"
        fill="#22d3ee" opacity="0.92">AGENT 24</text>
  <text x="788" y="212" font-family="Fira Code, Consolas, monospace" font-size="34" font-weight="700"
        fill="#3ddc84" opacity="0.92">ASSISTANT</text>
  <rect x="788" y="232" width="340" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="788" y="270" font-family="Fira Code, Consolas, monospace" font-size="15" fill="#8ea3bd">
    plan &#183; execute &#183; verify &#183; report
  </text>
  <text x="788" y="306" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#3ddc84">
    [ SYSTEM: READY ]
    <animate attributeName="fill" values="#3ddc84;#8a2be2;#3ddc84" dur="4s" repeatCount="indefinite"/>
  </text>

  <g><rect x="64" y="330" width="84" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#3ddc84" stroke-opacity="0.55"/><text x="106" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#3ddc84" text-anchor="middle" letter-spacing="1">ANDROID</text></g>
  <g><rect x="158" y="330" width="76" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#3ddc84" stroke-opacity="0.55"/><text x="196" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#3ddc84" text-anchor="middle" letter-spacing="1">KOTLIN</text></g>
  <g><rect x="244" y="330" width="51" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#3ddc84" stroke-opacity="0.55"/><text x="269" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#3ddc84" text-anchor="middle" letter-spacing="1">LLM</text></g>
  <g><rect x="305" y="330" width="51" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#3ddc84" stroke-opacity="0.55"/><text x="330" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#3ddc84" text-anchor="middle" letter-spacing="1">MCP</text></g>
  <g><rect x="366" y="330" width="76" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#3ddc84" stroke-opacity="0.55"/><text x="404" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#3ddc84" text-anchor="middle" letter-spacing="1">TERMUX</text></g>
</svg>
